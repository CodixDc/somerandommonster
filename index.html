<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time In Sweden</title>
  <style>
    body {
      background: #0e0e0e;
      color: #00ff88;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 5rem;
      margin: 0;
    }

    p {
      margin-top: 1rem;
      color: #aaa;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1 id="time"></h1>
  <p>Svensk tid (Europe/Stockholm)</p>

  <script>
    function updateTime() {
      const options = {
        timeZone: "Europe/Stockholm",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      };
      const now = new Date().toLocaleTimeString("sv-SE", options);
      document.getElementById("time").textContent = now;
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
