<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweden Clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    color: #00ffc8;
    text-align: center;
  }

  /* Clock styling */
  .clock {
    display: flex;
    font-size: 5rem;
  }

  .digit {
    position: relative;
    width: 3ch;
    height: 1em;
    overflow: hidden;
  }

  .digit span {
    display: block;
    transform: translateY(0);
    transition: transform 0.3s ease-in-out;
  }

  /* Date styling */
  .date {
    margin-top: 1rem;
    font-size: 2rem;
    color: #00ffc8;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .date.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Colon spacing */
  .colon {
    margin: 0 0.2em;
  }
</style>
</head>
<body>

<div class="clock" id="clock">
  <div class="digit"><span>0</span></div>
  <div class="digit"><span>0</span></div>
  <div class="colon">:</div>
  <div class="digit"><span>0</span></div>
  <div class="digit"><span>0</span></div>
  <div class="colon">:</div>
  <div class="digit"><span>0</span></div>
  <div class="digit"><span>0</span></div>
</div>

<div class="date" id="date">Loading date...</div>

<script>
function pad(n){ return n.toString().padStart(2,'0'); }

function updateClock() {
  const now = new Date();
  const optionsTime = { timeZone: "Europe/Stockholm" };
  const hours = pad(now.toLocaleTimeString("en-GB", {...optionsTime, hour: "2-digit", hour12:false}));
  const minutes = pad(now.toLocaleTimeString("en-GB", {...optionsTime, minute: "2-digit"}));
  const seconds = pad(now.toLocaleTimeString("en-GB", {...optionsTime, second: "2-digit"}));

  const timeString = hours + minutes + seconds;
  const digits = document.querySelectorAll('.digit span');

  for(let i=0;i<digits.length;i++){
    if(digits[i].textContent !== timeString[i]){
      digits[i].textContent = timeString[i];
      digits[i].style.transform = 'translateY(-100%)';
      setTimeout(()=>digits[i].style.transform='translateY(0)',10);
    }
  }

  // Update date
  const optionsDate = { timeZone:"Europe/Stockholm", weekday:"long", day:"numeric", month:"long", year:"numeric" };
  const dateText = now.toLocaleDateString("en-GB", optionsDate);
  const dateEl = document.getElementById('date');
  dateEl.textContent = dateText;
  dateEl.classList.add('show');
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
