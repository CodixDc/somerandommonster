<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Time in Sweden</title>
  <style>
    /* --- Page layout --- */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #0a0a0a, #111, #1b1b1b, #0f0f0f);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #00ffc8;
      font-family: 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* --- Animations --- */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 5px #00ffc8, 0 0 15px #00ffc8; }
      50% { text-shadow: 0 0 15px #00ffc8, 0 0 35px #00ffc8; }
      100% { text-shadow: 0 0 5px #00ffc8, 0 0 15px #00ffc8; }
    }

    /* --- Clock text --- */
    h1 {
      font-size: 5rem;
      letter-spacing: 2px;
      animation: fadeIn 1s ease-out, glowPulse 3s infinite ease-in-out;
    }

    .date {
      color: #bbb;
      font-size: 1.4rem;
      margin-top: 0.6rem;
      animation: fadeIn 1.5s ease-out forwards;
    }

    .zone {
      color: #888;
      font-size: 1.1rem;
      margin-top: 0.3rem;
      letter-spacing: 0.5px;
      animation: fadeIn 2s ease-out forwards;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1 id="time">--:--:--</h1>
  <p class="date" id="date">Loading date...</p>
  <p class="zone">Time zone: Europe/Stockholm</p>

  <footer>Made with 💚 in Sweden</footer>

  <script>
    function updateTime() {
      const optionsTime = {
        timeZone: "Europe/Stockholm",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      };
      const optionsDate = {
        timeZone: "Europe/Stockholm",
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      };

      const now = new Date();
      document.getElementById("time").textContent = now.toLocaleTimeString("en-GB", optionsTime);
      document.getElementById("date").textContent = now.toLocaleDateString("en-GB", optionsDate);
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
